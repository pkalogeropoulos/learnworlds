name: Playwright learnworlds tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # this is where we could use specific values for our tests, let's keep it simple for now with local runs
    env:
      DEMO_COUPON_NAME=pkalogerop-coupon
      DEMO_COURSE_INITIAL_PRICE=10
      DEMO_COUPON_DISCOUNTED_PRICE=5
      DEMO_SCHOOL_NAME=pkalogerop
      DEMO_SCHOOL_URL=https://pkalogerop.learnworlds.com
      DEMO_COURSE_NAME=Intro to Ai
      DEMO_COURSE_ID=699e693a2a1dfdd7190737f2
      DEMO_NAME_01=p.kalogeropouloss@gmail.com
      DEMO_PASS_01=xy$xYPTirJmRNSZt@JzDF14*ra!&0%GepVWp.
      DEMO_USER_WITH_COUPON=testuser+197@gmail.com
      DEMO_USER_WITHOUT_COUPON=testuser+890@gmail.com
      STORAGE_STATE_PATH=storage/admin.state.json
      

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (with deps)
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test --project chromium

      # ---- Optional: generate Allure HTML report (if you enabled Allure) ----
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # ---- Upload artifacts (so you can download reports from the job) ----
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14