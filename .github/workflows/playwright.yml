name: Playwright learnworlds tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # this is where we could use specific values for our tests, let's keep it simple for now with local runs
    env:
      DEMO_COUPON_NAME: ${{ secrets.DEMO_COUPON_NAME }}
      DEMO_COURSE_INITIAL_PRICE: ${{ secrets.DEMO_COURSE_INITIAL_PRICE }}
      DEMO_COUPON_DISCOUNTED_PRICE: ${{ secrets.DEMO_COUPON_DISCOUNTED_PRICE }}
      DEMO_SCHOOL_NAME: ${{ secrets.DEMO_SCHOOL_NAME }}
      DEMO_SCHOOL_URL: ${{ secrets.DEMO_SCHOOL_URL }}
      DEMO_COURSE_NAME: ${{ secrets.DEMO_COURSE_NAME }}
      DEMO_COURSE_ID: ${{ secrets.DEMO_COURSE_ID }}
      DEMO_NAME_01: ${{ secrets.DEMO_NAME_01 }}
      DEMO_PASS_01: ${{ secrets.DEMO_PASS_01 }}
      DEMO_USER_WITH_COUPON: ${{ secrets.DEMO_USER_WITH_COUPON }}
      DEMO_USER_WITHOUT_COUPON: ${{ secrets.DEMO_USER_WITHOUT_COUPON }}
      STORAGE_STATE_PATH: ${{ secrets.STORAGE_STATE_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (with deps)
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test --project chromium

      # ---- Optional: generate Allure HTML report (if you enabled Allure) ----
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # ---- Upload artifacts (so you can download reports from the job) ----
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14